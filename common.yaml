# Shared configuration for all dashboard environments.
# All dashboards read from the main branch of this repo.
# Environment-specific overrides go in dev.yaml, internal.yaml, desp_staging.yaml, desp.yaml.
# The web server deep-merges common.yaml + {env}.yaml at runtime (env wins on conflicts).

experiment_description:
  climatedt-gen2:
    IFS-FESOM-10km:
      story-nudging-Tplus2K:
        r1: "An initially 9-year simulation with 5 ensemble members from 1 January 2017 to 31 December 2025 using the IFS atmosphere at ~9 km resolution on a TCo1279 cubic-octahedral spectral grid with 137 vertical levels, coupled with the FESOM2 ocean model on the variable-resolution unstructured NG5 mesh (ranging from ~4.5 km in high latitudes and eddy-rich regions such as the Gulf Stream to ~12 km in the tropics). The atmosphere is spectrally nudged to ERA5 reanalysis data for vorticity and divergence at large scales (T60 truncation) between 100–700 hPa. The background climate state is modified to represent a +2 K warmer world (approx. 2040) using fixed CMIP6 SSP3-7.0 forcings. This configuration branches from the NextGEMS coupled simulation initialized in 2020, allowing the model to replay observed weather events as they would unfold in a warmer future climate. The simulation is being extended continuously beyond 2025 while maintaining the same model configuration."
      story-nudging-cont:
        r1: "An initially 9-year simulation with 5 ensemble members from 1 January 2017 to 31 December 2025 using the IFS atmosphere at ~9 km resolution on a TCo1279 cubic-octahedral spectral grid with 137 vertical levels, coupled with the FESOM2 ocean model on the variable-resolution unstructured NG5 mesh (ranging from ~4.5 km in high latitudes and eddy-rich regions such as the Gulf Stream to ~12 km in the tropics). The atmosphere is spectrally nudged to ERA5 reanalysis data for vorticity and divergence at large scales (T60 truncation) between 100–700 hPa. The background climate state is set to a counterfactual cooler condition representative of the 1950s using fixed CMIP6 historical forcing and a 5-year ocean spin-up (1945–1949). This run isolates the impact of background warming on the dynamics of specific weather systems by comparing against the historical baseline and Tplus2K simulations. The simulation is being extended continuously beyond 2025 while maintaining the same model configuration."
      story-nudging-hist:
        r1: "An initially 9-year simulation with 5 ensemble members from 1 January 2017 to 31 December 2025 using the IFS atmosphere at ~9 km resolution on a TCo1279 cubic-octahedral spectral grid with 137 vertical levels, coupled with the FESOM2 ocean model on the variable-resolution unstructured NG5 mesh (ranging from ~4.5 km in high latitudes and eddy-rich regions such as the Gulf Stream to ~12 km in the tropics). The atmosphere is spectrally nudged to ERA5 reanalysis data for vorticity and divergence at large scales (T60 truncation) between 100–700 hPa. The background climate state represents present-day conditions (2017–2024) using CMIP6 SSP3-7.0 transient forcings and 5-year ocean spin-up (2012–2016). This simulation serves as the validation baseline, ensuring the nudging technique accurately reproduces observed weather events before comparing them to modified climate states. The simulation is being extended continuously beyond 2025 while maintaining the same model configuration."
    
    ICON-5km:
      baseline-cont:
        r1: "An 11-year simulation from 1 January 1990 to 31 December 2000 with global mean concentrations of greenhouse gases, ozone, and aerosols fixed at 1990 levels. The model is configured with the ICON-A atmosphere on the R2B9 icosahedral grid (~5 km horizontal resolution) and the ICON-O ocean on a matching R2B9 grid (~5 km nominal resolution). The ocean initial state (1990-01-01) is taken from a spun-up ocean model run forced with climatological conditions. The atmospheric state, soil moisture, snow cover, and soil and surface temperature are derived from ERA5 without additional spin-up for the chosen start date and are interpolated onto the horizontal grid during pre-processing."
      baseline-hist:
        r1: "A 25-year simulation from 1 January 1990 to 31 December 2014 with all external forcings (greenhouse gases, aerosols, solar irradiance, volcanoes, land use) prescribed as time-varying following historical observations. The model is configured with the ICON-A atmosphere on the R2B9 icosahedral grid (~5 km horizontal resolution) and the ICON-O ocean on a matching R2B9 grid (~5 km nominal resolution). The ocean initial state (1990-01-01) is taken from a spun-up ocean model run forced with climatological conditions. The atmospheric state, soil moisture, snow cover, and soil and surface temperature are derived from ERA5 without additional spin-up for the chosen start date and are interpolated onto the horizontal grid during pre-processing."
      projections-ssp370:
        r1: "A 35-year simulation from 1 January 2015 to 31 December 2049 following the SSP3-7.0 scenario (Shared Socioeconomic Pathway 3 with high forcing). All external forcings (greenhouse gases, aerosols, solar irradiance, volcanoes, land use) evolve according to the SSP3-7.0 pathway. The model is configured with the ICON-A atmosphere on the R2B9 icosahedral grid (~5 km horizontal resolution) and the ICON-O ocean on a matching R2B9 grid (~5 km nominal resolution). The ocean initial state (2015-01-01) is taken from the end state of the baseline-hist simulation. The atmospheric state, soil moisture, snow cover, and soil and surface temperature are derived from ERA5 without additional spin-up for the chosen start date and are interpolated onto the horizontal grid during pre-processing."
    
    IFS-FESOM-5km:
      baseline-cont:
        r1: "A 10-year simulation from 1 January 1990 to 31 December 1999 with all external forcings, including greenhouse gases, ozone, and aerosol concentrations  fixed at 1990 levels. The atmosphere is configured on a TCO2559L137 grid (~5 km horizontal resolution), and the ocean on the FESOM NG5 unstructured grid, which features a spatially variable resolution of approximately 4.5 km in eddy-rich regions and up to 12 km in the tropics."
      baseline-hist:
        r1: "A 25-year simulation from 1 January 1990 to 31 December 2014 with all external forcings prescribed as time-varying following historical observations. The atmosphere is configured on a TCO2559L137 grid (~5 km horizontal resolution), and the ocean on the FESOM NG5 unstructured grid, which features a spatially variable resolution of approximately 4.5 km in eddy-rich regions and up to 12 km in the tropics."
      projections-ssp370:
        r1: "A 35-year simulation from 1 January 2015 to 31 December 2049 following the SSP3-7.0 scenario (Shared Socioeconomic Pathway 3 with high forcing). All external forcings evolve according to the SSP3-7.0 pathway. The atmosphere is configured on a TCO2559L137 grid (~5 km horizontal resolution), and the ocean on the FESOM NG5 unstructured grid, which features a spatially variable resolution of approximately 4.5 km in eddy-rich regions and up to 12 km in the tropics. The simulation is initialized from the end state of the historical simulation."
    
    IFS-NEMO-5km:
      baseline-cont:
        r1: "A 11-year simulation from 1 January 1990 to 31 December 2000 with all external forcings, including greenhouse gases, ozone, and aerosol concentrations fixed at 1990 levels. The atmosphere is configured on a TCO2559L137 grid (~5 km horizontal resolution), and the ocean on an eORCA12_Z75 grid (~7–9 km, 0.0833°). A two-year spin-up is applied to equilibrate the model before the simulation begins."
      baseline-hist:
        r1: "A 25-year simulation from 1 January 1990 to 31 December 2014 with all external forcings prescribed as time-varying following historical observations. The atmosphere is configured on a TCO2559L137 grid (~5 km horizontal resolution), and the ocean on an eORCA12_Z75 grid (~7–9 km, 0.0833°). A two-year spin-up is also applied to equilibrate the model prior to the simulation."
      projections-ssp370:
        r1: "A 35-year simulation from 1 January 2015 to 31 December 2049 following the SSP3 7.0 scenario (Shared Socioeconomic Pathway 3 with high forcing). All external forcings evolve according to the SSP3 7.0 pathway. The atmosphere is configured on a TCO2559L137 grid (~5 km horizontal resolution), and the ocean on an eORCA12_Z75 grid (~7–9 km, 0.0833°). The simulation is initialized from the end state of the historical simulation."
