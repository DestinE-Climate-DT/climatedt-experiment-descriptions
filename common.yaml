# Shared configuration for all dashboard environments.
# All dashboards read from the main branch of this repo.
# Environment-specific overrides go in dev.yaml, internal.yaml, desp_staging.yaml, desp.yaml.
# The web server deep-merges common.yaml + {env}.yaml at runtime (env wins on conflicts).

experiment_description:
  climatedt-gen2:
    IFS-FESOM-10km:
      story-nudging-Tplus2K:
        r1: "The Storyline Tplus2K description goes here"
      story-nudging-cont:
        r1: "The Storyline control description goes here"
      story-nudging-hist:
        r1: "The Storyline historical description goes here"
    
    ICON-5km:
      baseline-cont:
        r1: "The ICON control description goes here"
      baseline-hist:
        r1: "The ICON historical description goes here"
      projections-ssp370:
        r1: "The ICON SSP370 projection description goes here"
    
    IFS-FESOM-5km:
      baseline-cont:
        r1: "The IFS-FESOM control description goes here"
      baseline-hist:
        r1: "The IFS-FESOM historical description goes here"
      projections-ssp370:
        r1: "The IFS-FESOM SSP370 projection description goes here"
    
    IFS-NEMO-5km:
      baseline-cont:
        r1: "A 10-year simulation from 1 January 1990 to 31 December 1999 with all external forcings (greenhouse gases, aerosols, solar irradiance, volcanoes, land use) fixed at 1990 levels. The atmosphere is configured on a TCO2559L137 grid (~5 km horizontal resolution), and the ocean on an eORCA12_Z75 grid (~7–9 km, 0.0833°). A two-year spin-up is applied to equilibrate the model before the simulation begins."
      baseline-hist:
        r1: "A 25-year simulation from 1 January 1990 to 31 December 2014 with all external forcings prescribed as time-varying following historical observations. The same atmospheric and ocean resolutions are used: TCO2559L137 (~5 km) and eORCA12_Z75 (~7–9 km, 0.0833°). A two-year spin-up is also applied to equilibrate the model prior to the simulation."
      projections-ssp370:
        r1: "A 35-year simulation from 1 January 2015 to 31 December 2049 following the SSP3 7.0 scenario (Shared Socioeconomic Pathway 3 with high forcing). All external forcings (greenhouse gases, aerosols, solar irradiance, volcanoes, land use) evolve according to the SSP3 7.0 pathway. The model configuration remains unchanged: TCO2559L137 atmosphere (~5 km) and eORCA12_Z75 ocean (~7–9 km, 0.0833°). The simulation is initialized from the end state of the historical simulation."
