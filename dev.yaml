# Dev environment overrides.
# Keys here are deep-merged on top of common.yaml by the signer service.
# Use this to hide diagnostics, override descriptions, etc. for the dev dashboard.
#
# See README.md for the full reference of supported keys.

# --- experiment_description ---
# Override a description from common.yaml, and add one that only appears on dev.
experiment_description:
  climatedt-gen2:
    ICON-5km:
      baseline-cont:
        r1: "[DEV OVERRIDE] The ICON control description - overrides common.yaml on dev only."
    IFS-FESOM-10km:
      story-nudging-Tplus2K:
        r1: "[DEV OVERRIDE] Storyline +2K - dev-specific description."

# --- projects ---
# Rename and reorder projects in the left panel.
projects:
  climatedt-gen2:
    label: "ClimateDT Gen2 (dev)"
    order: 1

# --- models ---
# Rename a model and push it to the top.
models:
  climatedt-gen2:
    ICON-5km:
      label: "ICON 5km (Sapphire)"
      order: 1
    IFS-FESOM-10km:
      label: "IFS-FESOM 10km (Storylines)"
      order: 2
    IFS-FESOM-5km:
      label: "IFS-FESOM 5km"
      order: 3
    IFS-NEMO-5km:
      label: "IFS-NEMO 5km"
      order: 4

# --- experiments ---
# Rename experiments and set display order.
experiments:
  climatedt-gen2:
    ICON-5km:
      baseline-cont:
        label: "Control"
        order: 1
      baseline-hist:
        label: "Historical"
        order: 2
      projections-ssp370:
        label: "SSP3-7.0"
        order: 3

# --- ensembles ---
# Rename a specific ensemble member.
ensembles:
  climatedt-gen2:
    ICON-5km:
      baseline-cont:
        r1:
          label: "Run 1"

# --- diagnostics ---
# Custom labels and ordering for diagnostic panels.
diagnostics:
  Description:
    order: 50
  Info:
    label: "Experiment Info"
    order: 1
  Status:
    label: "Run Status"
    order: 3
  "Bias maps":
    label: "Bias Maps"
    order: 10
  "Ocean 3D":
    label: "Ocean (3D)"
    order: 20
  "Sea Ice":
    order: 30

# --- sub_diagnostics ---
# Rename and reorder sub-diagnostics within a parent.
sub_diagnostics:
  "Ocean 3D":
    "time series":
      label: "Time Series"
      order: 1
    "Hovmoller":
      label: "Hovmöller"
      order: 2
    "mean maps":
      label: "Mean Maps"
      order: 3

# --- info_keys ---
# Rename info-box fields shown in the Info panel.
info_keys:
  expid:
    label: "Experiment ID"
    order: 1
  institution:
    label: "Institution"
    order: 2
  note:
    label: "Notes"
    order: 3

# --- default_enabled ---
# Only these diagnostics are toggled ON by default; all others start OFF.
# Exception: Description, Info, Status keep their built-in defaults unless listed here.
default_enabled:
  diagnostics:
    - "Description"
    - "Info"
    - "Status"
    - "Bias maps"
  sub_diagnostics:
    "Ocean 3D":
      - "time series"
      - "mean maps"

# --- content_files ---
# Override the description text for a specific plot file.
content_files:
  "climatedt-gen2/ICON-5km/baseline-cont/r1/info_keys":
    note: "Dev-only info override! The note field does not exist normally, but we're adding it here to show how new fields can be added."

# --- hide ---
hide:
  # Hide an entire model globally on this environment.
  # models:
  #   climatedt-gen2:
  #     - IFS-NEMO-5km

  # Hide specific experiments from the left panel.
  experiments:
    climatedt-gen2:
      IFS-FESOM-10km:
        - story-nudging-hist

  # Hide a diagnostic globally across all experiments.
  diagnostics:
    - "Sea Ice"
    # Scoped hide: hide "Ocean 3D" only for the storyline +2K experiment.
    - "Ocean 3D":
        - "climatedt-gen2/IFS-FESOM-10km/story-nudging-Tplus2K/r1"

  # Hide a sub-diagnostic globally, and another scoped to one experiment.
  sub_diagnostics:
    "Ocean 3D":
      - "Hovmoller"
      - "mean maps":
          - "climatedt-gen2/IFS-FESOM-10km/story-nudging-cont/r1"

  # Hide a field from the Info panel.
  info_keys:
    - "institution"
